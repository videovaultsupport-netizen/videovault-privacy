<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06111f" />
    <meta name="description" content="Política de privacidad oficial de VideoVault, desarrollada por Ivan Mobile Studio." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://videovaultsupport-netizen.github.io/videovault-privacy/" />
    <link rel="stylesheet" href="./styles.css" />
    <title>VideoVault | Política de privacidad</title>
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="brand" href="#top" aria-label="VideoVault">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span><strong>VideoVault</strong><small>Ivan Mobile Studio</small></span>
        </a>
        <label class="language-picker">
          <span class="sr-only">Idioma</span>
          <select id="language" aria-label="Idioma"></select>
        </label>
      </header>
      <section class="hero" id="top">
        <div class="eyebrow">VideoVault · Privacy</div>
        <h1 id="policy-title">Política de privacidad</h1>
        <p class="updated">
          <span id="updated-label">Documento vigente</span>
          <span id="updated-date" class="updated-date">Última actualización: 27 de julio de 2026</span>
        </p>
      </section>
      <article class="policy-card" id="policy-content" aria-live="polite"></article>
      <aside class="contact-card">
        <div><span id="contact-label">Contacto de privacidad</span><strong>Ivan Mobile Studio</strong></div>
        <a href="mailto:videovault.support@gmail.com">videovault.support@gmail.com</a>
      </aside>
      <footer><span>© 2026 Ivan Mobile Studio</span><span>VideoVault</span></footer>
    </main>
    <noscript><div class="noscript">Para consultar esta política necesitas activar JavaScript. También puedes contactar a videovault.support@gmail.com.</div></noscript>
    <script src="./app.js" defer></script>
  </body>
</html>
